<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="admin-sidebar(activePage)"
     id="sidebar-wrap"
     class="shrink-0 transition-all duration-300 ease-out overflow-hidden"
     style="width:224px;margin-right:0">
    <aside class="w-56 bg-admin-surface border-r border-admin-border flex flex-col px-4 py-7 h-screen sticky top-0 shrink-0 overflow-hidden">
        <div class="pl-3 mb-9">
            <div class="flex items-center gap-2.5 mb-1">
                <div class="w-8 h-8 rounded-xl bg-admin-accent flex items-center justify-center">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <span class="text-xl font-bold text-ink tracking-tight">관리자</span>
            </div>
            <p class="text-xs text-ink-muted mt-0.5">Admin System</p>
        </div>
        <nav class="flex flex-col gap-1 flex-1 relative" id="admin-sidebar-nav">
            <div id="admin-nav-pill"
                 class="absolute inset-x-0 rounded-xl bg-admin-accent-light pointer-events-none"
                 style="top:0;height:40px;opacity:0"></div>

            <a th:href="@{/admin}"
               hx-get="/admin"
               hx-target="#admin-main-content"
               hx-select="#admin-main-content"
               hx-push-url="true"
               data-page="admin"
               onclick="moveAdminPillTo(this)"
               class="relative z-[1] nav-btn flex items-center gap-3 px-3.5 py-1.5 rounded-xl text-sm transition-colors w-full text-left border border-transparent"
               th:classappend="${activePage == 'admin'} ? 'text-admin-accent font-semibold' : 'text-ink-soft font-normal'">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 12h8v9h-8zM3 15h8v6H3z"/></svg>
                대시보드
            </a>
            <a th:href="@{/admin/code}"
               hx-get="/admin/code"
               hx-target="#admin-main-content"
               hx-select="#admin-main-content"
               hx-push-url="true"
               data-page="code"
               onclick="moveAdminPillTo(this)"
               class="relative z-[1] nav-btn flex items-center gap-3 px-3.5 py-1.5 rounded-xl text-sm transition-colors w-full text-left border border-transparent"
               th:classappend="${activePage == 'code'} ? 'text-admin-accent font-semibold' : 'text-ink-soft font-normal'">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c-5.52 0-10 2.24-10 5s4.48 5 10 5 10-2.24 10-5-4.48-5-10-5M2 7v5c0 2.76 4.48 5 10 5s10-2.24 10-5V7M2 12v5c0 2.76 4.48 5 10 5s10-2.24 10-5v-5"/></svg>
                코드 데이터 관리
            </a>
            <a th:href="@{/admin/users}"
               hx-get="/admin/users"
               hx-target="#admin-main-content"
               hx-select="#admin-main-content"
               hx-push-url="true"
               data-page="users"
               onclick="moveAdminPillTo(this)"
               class="relative z-[1] nav-btn flex items-center gap-3 px-3.5 py-1.5 rounded-xl text-sm transition-colors w-full text-left border border-transparent"
               th:classappend="${activePage == 'users'} ? 'text-admin-accent font-semibold' : 'text-ink-soft font-normal'">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8m14 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                사용자 관리
            </a>
            <a th:href="@{/admin/logs}"
               hx-get="/admin/logs"
               hx-target="#admin-main-content"
               hx-select="#admin-main-content"
               hx-push-url="true"
               data-page="logs"
               onclick="moveAdminPillTo(this)"
               class="relative z-[1] nav-btn flex items-center gap-3 px-3.5 py-1.5 rounded-xl text-sm transition-colors w-full text-left border border-transparent"
               th:classappend="${activePage == 'logs'} ? 'text-admin-accent font-semibold' : 'text-ink-soft font-normal'">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                시스템 로그
            </a>
        </nav>
        <div class="h-px bg-admin-border my-4"></div>
        <a th:href="@{/}" class="flex items-center gap-2.5 px-3.5 py-1.5 rounded-xl border border-admin-border text-xs font-medium text-ink-muted hover:border-sage-mid hover:bg-sage-light hover:text-sage transition-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            사용자 페이지로
        </a>
    </aside>

    <script th:src="@{/js/common/admin-nav.js}"></script>
</div>

</body>
</html>
