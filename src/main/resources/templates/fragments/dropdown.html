<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    공통 드롭다운 Fragment
    파라미터:
      dropId      — HTML id prefix (예: 'level' → level-wrap, level-btn, level-dd)
      placeholder — 전체 선택 시 표시될 기본 레이블
      items       — List<CodeResponse> (codeId, codeNm 접근 가능한 객체)
-->
<div th:fragment="dropdown(dropId, placeholder, items)"
     th:id="${dropId + '-wrap'}"
     th:attr="data-value=''"
     class="relative">

    <button type="button"
            th:id="${dropId + '-btn'}"
            th:attr="data-drop-id=${dropId}"
            onclick="Dropdown.toggle(this.dataset.dropId)"
            class="flex items-center gap-2 px-3.5 py-2 rounded-xl border border-admin-border text-sm text-ink hover:bg-admin-subtle transition-colors">
        <span th:id="${dropId + '-label'}" th:text="${placeholder}">선택</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ml-auto shrink-0">
            <path d="M6 9l6 6 6-6"/>
        </svg>
    </button>

    <div th:id="${dropId + '-dd'}"
         class="hidden absolute top-full left-0 mt-1.5 z-50 anim-slideDown">
        <div class="bg-admin-surface border border-admin-border rounded-2xl shadow-xl p-1.5 min-w-[8rem]">

            <button type="button"
                    th:attr="data-drop-id=${dropId}, data-name=${placeholder}"
                    data-code=""
                    onclick="Dropdown.select(this.dataset.dropId, this.dataset.code, this.dataset.name)"
                    class="w-full text-left px-3 py-2 rounded-xl text-xs text-ink-soft font-medium hover:bg-admin-subtle transition-colors">
                전체
            </button>

            <button type="button"
                    th:each="item : ${items}"
                    th:attr="data-drop-id=${dropId}"
                    th:data-code="${item.codeId}"
                    th:data-name="${item.codeNm}"
                    th:text="${item.codeNm}"
                    onclick="Dropdown.select(this.dataset.dropId, this.dataset.code, this.dataset.name)"
                    class="w-full text-left px-3 py-2 rounded-xl text-xs text-ink-soft font-medium hover:bg-admin-subtle transition-colors">
            </button>

        </div>
    </div>

</div>

</body>
</html>
