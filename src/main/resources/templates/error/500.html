<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 오류 · 가계부</title>
    <th:block th:replace="~{config/config :: config}"></th:block>
    <style>
        body { font-family: 'DM Sans', 'Gowun Dodum', sans-serif; background: #F5F3EF; color: #2C2A26; }
    </style>
</head>
<body class="min-h-screen">

<main class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-[420px] text-center animate-fade-in">

        <!-- 로고 -->
        <div class="flex items-center justify-center gap-2 mb-10">
            <div class="w-8 h-8 rounded-lg-1 bg-green flex items-center justify-center text-white font-bold text-sm">₩</div>
            <div class="text-sm-1 font-bold tracking-tight text-text">가계부</div>
        </div>

        <!-- 아이콘 -->
        <div class="w-16 h-16 mx-auto rounded-xl-1 bg-coral-light flex items-center justify-center text-coral mb-6">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
                <path d="M12 9v4"/>
                <path d="M12 17h.01"/>
            </svg>
        </div>

        <div class="text-xs-1 text-coral font-semibold tracking-label uppercase mb-3">500 Error</div>
        <h1 class="font-dodum text-2xl-1 leading-tight tracking-tight text-text mb-3">일시적인 오류가 발생했어요</h1>
        <p class="text-sm text-text-soft leading-relaxed mb-8">
            요청을 처리하는 중 문제가 발생했어요.<br>
            잠시 후 다시 시도해주세요.
        </p>

        <div class="flex items-center justify-center gap-2.5">
            <button type="button" id="btn-reload"
                    class="px-6 py-3.5 rounded-lg-1 border-hairline border-border bg-surface text-sm font-medium text-text-soft hover:bg-surface-2 transition">
                다시 시도
            </button>
            <a th:href="@{/}"
               class="inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-lg-1 bg-green text-white text-sm font-semibold shadow-btn-green hover:shadow-btn-green-hover hover:-translate-y-px transition-all">
                홈으로 가기
            </a>
        </div>
    </div>
</main>
<script th:src="@{/js/error/500.js}"></script>
</body>
</html>
