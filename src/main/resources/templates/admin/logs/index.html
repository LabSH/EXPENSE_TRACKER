<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 로그 — 가계부</title>
    <th:block th:replace="~{config/config :: config}"></th:block>
    <style>
        @keyframes slideDown  { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
        @keyframes fadeIn     { from{opacity:0} to{opacity:1} }
        @keyframes slideUp    { from{opacity:0;transform:translateY(24px) scale(.98)} to{opacity:1;transform:none} }
        @keyframes fadeSlideUp{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
        .anim-slideDown { animation:slideDown  .25s cubic-bezier(.22,1,.36,1) both }
        .anim-fadeIn    { animation:fadeIn     .2s  ease forwards }
        .anim-slideUp   { animation:slideUp    .32s cubic-bezier(.22,1,.36,1) forwards }
        .anim-up        { animation:fadeSlideUp .35s cubic-bezier(.22,1,.36,1) both }
        ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#E5E0D8;border-radius:3px}
        a{text-decoration:none}
    </style>
</head>
<body class="bg-admin font-sans text-ink">

<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('logs')}"></div>

    <!-- Main -->
    <div id="admin-main-content" class="flex-1 overflow-hidden">
    <main class="overflow-y-auto h-screen p-9">
        <div class="flex items-start gap-4 mb-8">
            <button id="sidebar-toggle" class="w-8 h-8 rounded-xl border border-admin-border bg-admin-surface flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors shrink-0 mt-1">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h12"/></svg>
            </button>
            <div>
                <div class="flex items-center gap-2.5 mb-1.5">
                    <span class="px-2.5 py-1 rounded-full bg-admin-accent-light text-admin-accent text-xs font-semibold">관리자 모드</span>
                </div>
                <h1 class="text-3xl font-bold text-ink tracking-tight">시스템 로그</h1>
                <p class="text-sm text-ink-muted mt-1">서비스 전반의 이벤트 및 오류 이력을 확인합니다</p>
            </div>
        </div>

        <!-- Log panel -->
        <div id="log-panel" class="anim-up bg-admin-surface border border-admin-border rounded-2xl overflow-hidden">

            <!-- 카드 헤더 -->
            <div class="px-7 py-5 border-b border-admin-border flex items-center justify-between">
                <h3 class="text-sm font-bold text-ink">시스템 로그</h3>
                <span id="log-count" class="text-xs text-ink-muted">총 0건</span>
            </div>

            <!-- 필터 바 -->
            <div class="px-7 py-3 border-b border-admin-border flex items-center gap-3 flex-wrap">

                <!-- From 날짜 피커 -->
                <div class="relative" id="from-wrap">
                    <button id="from-btn" onclick="togglePicker('from')"
                            class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-admin-border text-sm text-ink hover:bg-admin-subtle transition-colors">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                        <span id="from-label">날짜 선택</span>
                    </button>
                    <div id="from-cal" class="hidden z-50 anim-slideDown"></div>
                </div>

                <span class="text-ink-muted text-sm">—</span>

                <!-- To 날짜 피커 -->
                <div class="relative" id="to-wrap">
                    <button id="to-btn" onclick="togglePicker('to')"
                            class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-admin-border text-sm text-ink hover:bg-admin-subtle transition-colors">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                        <span id="to-label">날짜 선택</span>
                    </button>
                    <div id="to-cal" class="hidden z-50 anim-slideDown"></div>
                </div>

                <!-- 레벨 드롭다운 -->
                <div th:replace="~{fragments/dropdown :: dropdown('level', ${selectedLevelName}, ${codes['LOGLEVEL']}, 'admin')}"></div>

                <div class="w-px h-5 bg-admin-border"></div>
                <button onclick="searchLogs()"
                        class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-admin-accent text-white text-sm font-semibold hover:opacity-90 transition-opacity border border-transparent">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <span>검색</span>
                </button>
                <button onclick="resetFilter()"
                        class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-admin-border text-sm font-medium text-ink-soft hover:bg-admin-subtle transition-colors">
                    <span>초기화</span>
                </button>
            </div>

            <!-- 컬럼 헤더 -->
            <div class="grid px-7 py-2.5 bg-admin-subtle border-b border-admin-border text-xs font-semibold text-ink-muted uppercase tracking-wide"
                 style="grid-template-columns:140px 85px 130px 65px 270px 55px 70px 110px 1fr">
                <span>시간</span>
                <span>레벨</span>
                <span>사용자</span>
                <span>메서드</span>
                <span>요청경로</span>
                <span>상태</span>
                <span>처리시간</span>
                <span>IP</span>
                <span>에러메시지</span>
            </div>

            <!-- 로그 목록 -->
            <div id="log-list"></div>

        </div>
    </main>

<!-- 로그 상세 모달 (정보 확인 전용 — backdrop 클릭 닫기 허용) -->
<div id="log-detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/30" onclick="closeLogDetail()"></div>
    <div class="relative w-full max-w-[38rem] mx-4 bg-admin-surface border border-admin-border rounded-2xl shadow-xl anim-slideUp">

        <!-- 헤더 -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-admin-border">
            <div class="flex items-center gap-3">
                <h3 class="text-sm font-bold text-ink">상세내용</h3>
            </div>
            <button onclick="closeLogDetail()"
                    class="w-7 h-7 rounded-lg flex items-center justify-center text-ink-muted hover:bg-admin-subtle hover:text-ink transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- 본문 -->
        <div class="px-6 py-5 space-y-3">
            <div class="grid grid-cols-[100px_1fr] gap-x-4 gap-y-3 text-sm">
                <span class="text-ink-muted">레벨</span>
                <span id="detail-level" class="w-fit"></span>

                <span class="text-ink-muted">시간</span>
                <span id="detail-time" class="font-mono text-xs text-ink"></span>

                <span class="text-ink-muted">사용자</span>
                <span id="detail-user" class="text-ink"></span>

                <span class="text-ink-muted">메서드</span>
                <span id="detail-method" class="font-mono font-semibold text-ink"></span>

                <span class="text-ink-muted">요청 경로</span>
                <span id="detail-uri" class="text-ink break-all"></span>

                <span class="text-ink-muted">HTTP 상태</span>
                <span id="detail-status" class="font-mono text-sm"></span>

                <span class="text-ink-muted">처리 시간</span>
                <span id="detail-ms" class="text-ink"></span>

                <span class="text-ink-muted">클라이언트 IP</span>
                <span id="detail-ip" class="font-mono text-xs text-ink"></span>
            </div>

            <!-- 에러 메시지 (있을 때만) -->
            <div id="detail-error-wrap" class="hidden pt-2 border-t border-admin-border">
                <p class="text-xs text-ink-muted mb-1.5">에러 메시지</p>
                <pre id="detail-error" class="text-xs text-blush bg-blush-light rounded-xl p-3.5 whitespace-pre-wrap break-all leading-relaxed max-h-40 overflow-y-auto"></pre>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
var LOGS          = /*[[${logs}]]*/ [];
var selectedFrom  = /*[[${from}]]*/ '';
var selectedTo    = /*[[${to}]]*/ '';
var selectedLevel = /*[[${selectedLevel}]]*/ '';
</script>

<script th:src="@{/js/admin/logs.js}"></script>
</div>
</div>

</body>
</html>
