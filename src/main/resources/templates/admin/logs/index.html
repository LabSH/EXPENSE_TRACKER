<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 로그 — 가계부</title>
    <th:block th:replace="~{config/config :: config}"></th:block>
    <style>
        @keyframes slideDown  { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
        @keyframes fadeIn     { from{opacity:0} to{opacity:1} }
        @keyframes slideUp    { from{opacity:0;transform:translateY(24px) scale(.98)} to{opacity:1;transform:none} }
        @keyframes fadeSlideUp{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
        .anim-slideDown { animation:slideDown  .25s cubic-bezier(.22,1,.36,1) both }
        .anim-fadeIn    { animation:fadeIn     .2s  ease forwards }
        .anim-slideUp   { animation:slideUp    .32s cubic-bezier(.22,1,.36,1) forwards }
        .anim-up        { animation:fadeSlideUp .35s cubic-bezier(.22,1,.36,1) both }
        ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#DDD9EE;border-radius:3px}
        a{text-decoration:none;color:inherit}
    </style>
</head>
<body class="bg-admin font-sans text-ink">

<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('logs')}"></div>

    <!-- Main -->
    <div id="admin-main-content" class="flex-1 overflow-hidden">
    <main class="overflow-y-auto h-screen p-9">
        <div class="flex items-start gap-4 mb-8">
            <button id="sidebar-toggle" class="w-9 h-9 rounded-xl border border-admin-border bg-admin-surface flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors shrink-0 mt-1">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h12"/></svg>
            </button>
            <div>
                <div class="flex items-center gap-2.5 mb-1.5">
                    <span class="px-2.5 py-1 rounded-full bg-violet-light text-violet text-xs font-semibold">관리자 모드</span>
                </div>
                <h1 class="text-3xl font-bold text-ink tracking-tight">시스템 로그</h1>
                <p class="text-sm text-ink-muted mt-1">서비스 전반의 이벤트 및 오류 이력을 확인합니다</p>
            </div>
        </div>

        <!-- Log panel -->
        <div id="log-panel" class="anim-up bg-admin-surface border border-admin-border rounded-2xl overflow-hidden">

            <!-- 카드 헤더 -->
            <div class="px-7 py-5 border-b border-admin-border flex items-center justify-between">
                <h3 class="text-sm font-bold text-ink">시스템 로그</h3>
                <span id="log-count" class="text-xs text-ink-muted">총 0건</span>
            </div>

            <!-- 필터 바 -->
            <div class="px-7 py-3 border-b border-admin-border flex items-center gap-3 flex-wrap">

                <!-- From 날짜 피커 -->
                <div class="relative" id="from-wrap">
                    <button id="from-btn" onclick="togglePicker('from')"
                            class="flex items-center gap-2 px-3.5 py-2 rounded-xl border border-admin-border text-sm text-ink hover:bg-admin-subtle transition-colors">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                        <span id="from-label">날짜 선택</span>
                    </button>
                    <div id="from-cal" class="hidden absolute top-full left-0 mt-1.5 z-50 anim-slideDown"></div>
                </div>

                <span class="text-ink-muted text-sm">—</span>

                <!-- To 날짜 피커 -->
                <div class="relative" id="to-wrap">
                    <button id="to-btn" onclick="togglePicker('to')"
                            class="flex items-center gap-2 px-3.5 py-2 rounded-xl border border-admin-border text-sm text-ink hover:bg-admin-subtle transition-colors">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                        <span id="to-label">날짜 선택</span>
                    </button>
                    <div id="to-cal" class="hidden absolute top-full left-0 mt-1.5 z-50 anim-slideDown"></div>
                </div>

                <!-- 레벨 드롭다운 -->
                <div th:replace="~{fragments/dropdown :: dropdown('level', ${selectedLevelName}, ${codes['LOGLEVEL']})}"></div>

                <div class="w-px h-5 bg-admin-border"></div>
                <button onclick="searchLogs()"
                        class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-violet text-white text-xs font-semibold hover:opacity-90 transition-opacity">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    검색
                </button>
                <button onclick="resetFilter()"
                        class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-admin-border text-xs font-medium text-ink-soft hover:bg-admin-subtle transition-colors">
                    초기화
                </button>
            </div>

            <!-- 컬럼 헤더 -->
            <div class="grid px-7 py-2.5 bg-admin-subtle border-b border-admin-border text-xs font-semibold text-ink-muted uppercase tracking-wide"
                 style="grid-template-columns:140px 85px 130px 65px 270px 55px 70px 110px 1fr">
                <span>시간</span>
                <span>레벨</span>
                <span>사용자</span>
                <span>메서드</span>
                <span>요청경로</span>
                <span>상태</span>
                <span>처리시간</span>
                <span>IP</span>
                <span>에러메시지</span>
            </div>

            <!-- 로그 목록 -->
            <div id="log-list"></div>

        </div>
    </main>

<!-- 로그 상세 모달 (정보 확인 전용 — backdrop 클릭 닫기 허용) -->
<div id="log-detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/30" onclick="closeLogDetail()"></div>
    <div class="relative w-full max-w-[38rem] mx-4 bg-admin-surface border border-admin-border rounded-2xl shadow-xl anim-slideUp">

        <!-- 헤더 -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-admin-border">
            <div class="flex items-center gap-3">
                <h3 class="text-sm font-bold text-ink">상세내용</h3>
            </div>
            <button onclick="closeLogDetail()"
                    class="w-7 h-7 rounded-lg flex items-center justify-center text-ink-muted hover:bg-admin-subtle hover:text-ink transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- 본문 -->
        <div class="px-6 py-5 space-y-3">
            <div class="grid grid-cols-[100px_1fr] gap-x-4 gap-y-3 text-sm">
                <span class="text-ink-muted">레벨</span>
                <span id="detail-level" class="w-fit"></span>

                <span class="text-ink-muted">시간</span>
                <span id="detail-time" class="font-mono text-xs text-ink"></span>

                <span class="text-ink-muted">사용자</span>
                <span id="detail-user" class="text-ink"></span>

                <span class="text-ink-muted">메서드</span>
                <span id="detail-method" class="font-mono font-semibold text-ink"></span>

                <span class="text-ink-muted">요청 경로</span>
                <span id="detail-uri" class="text-ink break-all"></span>

                <span class="text-ink-muted">HTTP 상태</span>
                <span id="detail-status" class="font-mono text-sm"></span>

                <span class="text-ink-muted">처리 시간</span>
                <span id="detail-ms" class="text-ink"></span>

                <span class="text-ink-muted">클라이언트 IP</span>
                <span id="detail-ip" class="font-mono text-xs text-ink"></span>
            </div>

            <!-- 에러 메시지 (있을 때만) -->
            <div id="detail-error-wrap" class="hidden pt-2 border-t border-admin-border">
                <p class="text-xs text-ink-muted mb-1.5">에러 메시지</p>
                <pre id="detail-error" class="text-xs text-blush bg-blush-light rounded-xl p-3.5 whitespace-pre-wrap break-all leading-relaxed max-h-40 overflow-y-auto"></pre>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
var LOGS          = /*[[${logs}]]*/ [];
var selectedFrom  = /*[[${from}]]*/ '';
var selectedTo    = /*[[${to}]]*/ '';
var selectedLevel = /*[[${selectedLevel}]]*/ '';
</script>

<script>
var LEVEL_CFG = {
    INFO:    {
        cls:  'bg-sky-light text-sky',
        icon: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10M12 16v-4M12 8h.01"/></svg>`,
    },
    DEBUG:   {
        cls:  'bg-admin-subtle text-ink-muted',
        icon: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10M12 16v-4M12 8h.01"/></svg>`,
    },
    WARNING: {
        cls:  'bg-yellow-50 text-yellow-600',
        icon: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0M12 9v4M12 17h.01"/></svg>`,
    },
    ERROR:   {
        cls:  'bg-blush-light text-blush',
        icon: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`,
    },
};

// ── 로그 검색 / 렌더 ──────────────────────────────────────────
async function searchLogs() {
    const from  = CalendarPicker.getDate('from');
    const to    = CalendarPicker.getDate('to');
    const level = Dropdown.getValue('level');

    const params = new URLSearchParams({ from, to, level });
    history.pushState(null, '', `/admin/logs?${params}`);

    const res  = await fetch(`/admin/logs/data?${params}`);
    const data = await res.json();
    renderLogs(data);
}

function resetFilter() {
    const now   = new Date();
    const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    CalendarPicker.setDate('from', today);
    CalendarPicker.setDate('to',   today);
    Dropdown.reset('level');
    searchLogs();
}

var currentLogs = [];

function renderLogs(logs) {
    currentLogs = logs;
    document.getElementById('log-count').textContent = `총 ${logs.length}건`;

    const list = document.getElementById('log-list');
    if (logs.length === 0) {
        list.innerHTML = `
            <div class="px-7 py-16 text-center">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-3 text-ink-muted opacity-30">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                </svg>
                <p class="text-sm font-medium text-ink-soft">조회된 로그가 없어요</p>
                <p class="text-xs text-ink-muted mt-1">날짜 범위를 변경해 다시 검색해 주세요</p>
            </div>`;
        return;
    }

    list.innerHTML = logs.map((log, i) => {
        const lc     = LEVEL_CFG[log.level] || LEVEL_CFG.INFO;
        const border = i < logs.length - 1 ? 'border-b border-admin-border' : '';

        const statusCls = !log.httpStatus          ? 'text-ink-muted'
                        : log.httpStatus >= 500    ? 'text-blush font-bold'
                        : log.httpStatus >= 400    ? 'text-yellow-600 font-bold'
                        :                            'text-sage font-semibold';

        return `
            <div class="grid px-7 py-3 items-center hover:bg-admin-subtle transition-colors cursor-pointer ${border}"
                 style="grid-template-columns:140px 85px 130px 65px 270px 55px 70px 110px 1fr"
                 onclick="openLogDetail(${i})">
                <span class="font-mono text-xs text-ink-muted">${log.time}</span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-bold w-fit ${lc.cls}">
                    ${lc.icon}${log.level}
                </span>
                <span class="text-xs text-ink-soft truncate pr-2">${log.user ?? '—'}</span>
                <span class="text-xs font-mono font-semibold text-ink">${log.httpMethod ?? '—'}</span>
                <span class="text-xs text-ink truncate pr-2">${log.requestUri ?? '—'}</span>
                <span class="text-xs ${statusCls}">${log.httpStatus ?? '—'}</span>
                <span class="text-xs text-ink-muted">${log.responseMs != null ? log.responseMs + 'ms' : '—'}</span>
                <span class="text-xs text-ink-muted truncate pr-2">${log.clientIp ?? '—'}</span>
                <span class="text-xs text-blush truncate">${log.errorMsg ?? '—'}</span>
            </div>`;
    }).join('');
}

// 초기 렌더 — 서버에서 받은 날짜/레벨로 초기화 후 바로 렌더
(function () {
    CalendarPicker.init(['from', 'to']);
    CalendarPicker.setDate('from', selectedFrom);
    CalendarPicker.setDate('to',   selectedTo);
    document.getElementById('level-wrap').dataset.value = selectedLevel;
    renderLogs(LOGS);
}());

// ── 로그 상세 모달 ────────────────────────────────────────────
function openLogDetail(index) {
    const log = currentLogs[index];
    const lc  = LEVEL_CFG[log.level] || LEVEL_CFG.INFO;

    const statusCls = !log.httpStatus          ? 'text-ink-muted'
                    : log.httpStatus >= 500    ? 'text-blush font-bold'
                    : log.httpStatus >= 400    ? 'text-yellow-600 font-bold'
                    :                            'text-sage font-semibold';

    document.getElementById('detail-level').className =
        `inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-bold w-fit ${lc.cls}`;
    document.getElementById('detail-level').innerHTML = `${lc.icon}${log.level}`;

    document.getElementById('detail-time').textContent      = log.time        || '—';
    document.getElementById('detail-user').textContent      = log.user        || '—';
    document.getElementById('detail-method').textContent    = log.httpMethod  || '—';
    document.getElementById('detail-uri').textContent       = log.requestUri  || '—';
    document.getElementById('detail-status').textContent    = log.httpStatus  ?? '—';
    document.getElementById('detail-status').className      = `text-sm font-mono ${statusCls}`;
    document.getElementById('detail-ms').textContent        = log.responseMs != null ? log.responseMs + ' ms' : '—';
    document.getElementById('detail-ip').textContent        = log.clientIp    || '—';
    document.getElementById('detail-error').textContent     = log.errorMsg    || '—';
    document.getElementById('detail-error-wrap').classList.toggle('hidden', !log.errorMsg);

    document.getElementById('log-detail-modal').classList.remove('hidden');
}

function closeLogDetail() {
    document.getElementById('log-detail-modal').classList.add('hidden');
}

</script>
</div>
</div>

</body>
</html>
