<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 관리 — 가계부</title>
    <th:block th:replace="~{config/config :: config}"></th:block>
    <style>
        @keyframes slideDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        @keyframes slideUp { from{opacity:0;transform:translateY(24px) scale(.98)} to{opacity:1;transform:none} }
        @keyframes fadeSlideUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
        .anim-slideDown { animation:slideDown .25s cubic-bezier(.22,1,.36,1) both }
        .anim-fadeIn { animation:fadeIn .2s ease forwards }
        .anim-slideUp { animation:slideUp .32s cubic-bezier(.22,1,.36,1) forwards }
        .anim-up { animation:fadeSlideUp .35s cubic-bezier(.22,1,.36,1) both }
        ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#DDD9EE;border-radius:3px}
        a{text-decoration:none;color:inherit}
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-admin font-sans text-ink">

<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('users')}"></div>

    <!-- Main -->
    <div id="admin-main-content" class="flex-1 overflow-hidden">
    <style>.hidden{display:none !important}</style>
    <main class="overflow-y-auto h-screen p-9">
        <div class="flex items-start justify-between gap-4 mb-8">
            <div class="flex items-start gap-4 flex-1">
                <button id="sidebar-toggle" class="w-9 h-9 rounded-xl border border-admin-border bg-admin-surface flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors shrink-0 mt-1">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h12"/></svg>
                </button>
                <div>
                    <div class="flex items-center gap-2.5 mb-1.5">
                        <span class="px-2.5 py-1 rounded-full bg-violet-light text-violet text-xs font-semibold">관리자 모드</span>
                    </div>
                    <h1 class="text-3xl font-bold text-ink tracking-tight">사용자 관리</h1>
                    <p class="text-sm text-ink-muted mt-1">가계부 서비스의 사용자 계정과 권한을 관리합니다</p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0 mt-1">
                <div class="flex flex-col items-center py-3 px-4 bg-admin-subtle rounded-xl min-w-[88px]">
                    <span id="stat-total" class="text-2xl font-bold text-violet">0</span>
                    <span class="text-xs text-ink-muted mt-0.5">전체</span>
                </div>
                <div class="flex flex-col items-center py-3 px-4 bg-admin-subtle rounded-xl min-w-[88px]">
                    <span id="stat-active" class="text-2xl font-bold text-sage">0</span>
                    <span class="text-xs text-ink-muted mt-0.5">활성</span>
                </div>
                <div class="flex flex-col items-center py-3 px-4 bg-admin-subtle rounded-xl min-w-[88px]">
                    <span id="stat-inactive" class="text-2xl font-bold text-blush">0</span>
                    <span class="text-xs text-ink-muted mt-0.5">비활성</span>
                </div>
            </div>
        </div>

        <div id="users-panel"></div>
    </main>

<!-- 사용자 추가 모달 -->
<div id="modal-user-add" class="hidden anim-fadeIn fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-md">
    <div class="anim-slideUp bg-admin-surface rounded-2xl w-96 shadow-2xl overflow-hidden">
        <div class="px-7 pt-6 pb-5 border-b border-admin-border bg-violet-light flex justify-between items-center">
            <h2 class="text-base font-bold text-ink">사용자 추가</h2>
            <button onclick="closeModal('modal-user-add')" class="w-8 h-8 rounded-full bg-admin-border flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="px-7 py-5 flex flex-col gap-4">
            <div>
                <label class="block text-xs font-medium text-ink-soft mb-1.5">이름</label>
                <input id="new-user-name" type="text" placeholder="홍길동"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-admin-border bg-admin text-sm text-ink outline-none focus:border-violet transition-colors" />
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-soft mb-1.5">ID</label>
                <input id="new-user-id" type="text" placeholder="로그인에 사용할 ID"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-admin-border bg-admin text-sm text-ink outline-none focus:border-violet transition-colors" />
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-soft mb-1.5">PW</label>
                <div class="relative">
                    <input id="new-user-pw" type="password" placeholder="비밀번호 입력"
                           class="w-full px-3.5 py-2.5 pr-10 rounded-xl border border-admin-border bg-admin text-sm text-ink outline-none focus:border-violet transition-colors" />
                    <button onclick="togglePwVisibility()" id="pw-eye-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-muted hover:text-ink transition-colors">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-ink-soft mb-1.5">역할</label>
                <div class="flex gap-2" id="role-selector">
                    <button onclick="setNewUserRole('관리자')" data-role="관리자" class="role-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-admin-border text-ink-soft hover:bg-admin-subtle">관리자</button>
                    <button onclick="setNewUserRole('사용자')" data-role="사용자" class="role-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-violet bg-violet-light text-violet">사용자</button>
                    <button onclick="setNewUserRole('뷰어')" data-role="뷰어" class="role-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-admin-border text-ink-soft hover:bg-admin-subtle">뷰어</button>
                </div>
            </div>
        </div>
        <div class="px-7 pb-6 flex gap-2.5">
            <button onclick="closeModal('modal-user-add')" class="flex-1 py-3 rounded-xl border border-admin-border text-sm font-medium text-ink-soft hover:bg-admin-subtle transition-colors">취소</button>
            <button onclick="confirmAddUser()" class="flex-[2] py-3 rounded-xl bg-violet text-white text-sm font-semibold hover:opacity-90 transition-opacity">추가하기</button>
        </div>
    </div>
</div>

<!-- 비밀번호 초기화 모달 -->
<div id="modal-pw-reset" class="hidden anim-fadeIn fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-md">
    <div class="anim-slideUp bg-admin-surface rounded-2xl w-80 shadow-2xl overflow-hidden">
        <div class="px-7 pt-6 pb-5 border-b border-admin-border flex justify-between items-center bg-violet/10">
            <h2 class="text-base font-bold text-ink">비밀번호 초기화</h2>
            <button onclick="closeModal('modal-pw-reset')" class="w-8 h-8 rounded-full bg-admin-border flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="px-7 py-5">
            <div id="reset-user-info" class="flex items-center gap-3 mb-4 p-3 bg-admin-subtle rounded-xl"></div>
            <p class="text-sm text-ink-soft">해당 사용자의 비밀번호를 초기화하시겠어요?</p>
            <p class="text-xs text-ink-muted mt-1.5">초기화 후 아이디와 동일한 비밀번호로 변경돼요.</p>
        </div>
        <div class="px-7 pb-6 flex gap-2.5">
            <button onclick="closeModal('modal-pw-reset')" class="flex-1 py-3 rounded-xl border border-admin-border text-sm font-medium text-ink-soft hover:bg-admin-subtle transition-colors">취소</button>
            <button id="confirm-pw-reset-btn" class="flex-[2] py-3 rounded-xl bg-violet text-white text-sm font-semibold hover:opacity-90 transition-opacity">초기화하기</button>
        </div>
    </div>
</div>

<!-- 계정 삭제 모달 -->
<div id="modal-user-delete" class="hidden anim-fadeIn fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-md">
    <div class="anim-slideUp bg-admin-surface rounded-2xl w-80 shadow-2xl overflow-hidden">
        <div class="px-7 pt-6 pb-5 border-b border-admin-border flex justify-between items-center bg-blush/10">
            <h2 class="text-base font-bold text-ink">계정 삭제</h2>
            <button onclick="closeModal('modal-user-delete')" class="w-8 h-8 rounded-full bg-admin-border flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="px-7 py-5">
            <div id="delete-user-info" class="flex items-center gap-3 mb-4 p-3 bg-admin-subtle rounded-xl"></div>
            <p id="delete-user-confirm-text" class="text-sm text-ink-soft"></p>
            <p class="text-xs text-ink-muted mt-1.5">삭제한 계정은 복구할 수 없어요.</p>
        </div>
        <div class="px-7 pb-6 flex gap-2.5">
            <button onclick="closeModal('modal-user-delete')" class="flex-1 py-3 rounded-xl border border-admin-border text-sm font-medium text-ink-soft hover:bg-admin-subtle transition-colors">취소</button>
            <button id="confirm-user-delete" class="flex-[2] py-3 rounded-xl bg-blush text-white text-sm font-semibold hover:opacity-90 transition-opacity">삭제하기</button>
        </div>
    </div>
</div>

<!-- 역할 변경 모달 -->
<div id="modal-role-change" class="hidden anim-fadeIn fixed inset-0 z-50 flex items-center justify-center bg-ink/40 backdrop-blur-md">
    <div class="anim-slideUp bg-admin-surface rounded-2xl w-80 shadow-2xl overflow-hidden">
        <div class="px-7 pt-6 pb-5 border-b border-admin-border bg-sky-light flex justify-between items-center">
            <h2 class="text-base font-bold text-ink">권한 설정</h2>
            <button onclick="closeModal('modal-role-change')" class="w-8 h-8 rounded-full bg-admin-border flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="px-7 py-5 flex flex-col gap-4">
            <div id="role-change-user-info" class="flex items-center gap-3 p-3 bg-admin-subtle rounded-xl"></div>
            <div>
                <label class="block text-xs font-medium text-ink-soft mb-2">새 역할 선택</label>
                <div class="flex gap-2">
                    <button onclick="setChangeRole('ROLE_ADMIN')" data-role="ROLE_ADMIN"
                            class="role-change-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-admin-border text-ink-soft hover:bg-admin-subtle">관리자</button>
                    <button onclick="setChangeRole('ROLE_USER')" data-role="ROLE_USER"
                            class="role-change-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-admin-border text-ink-soft hover:bg-admin-subtle">사용자</button>
                    <button onclick="setChangeRole('ROLE_VIEWER')" data-role="ROLE_VIEWER"
                            class="role-change-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-admin-border text-ink-soft hover:bg-admin-subtle">뷰어</button>
                </div>
            </div>
        </div>
        <div class="px-7 pb-6 flex gap-2.5">
            <button onclick="closeModal('modal-role-change')" class="flex-1 py-3 rounded-xl border border-admin-border text-sm font-medium text-ink-soft hover:bg-admin-subtle transition-colors">취소</button>
            <button id="confirm-role-change-btn" class="flex-[2] py-3 rounded-xl bg-sky text-white text-sm font-semibold hover:opacity-90 transition-opacity">변경하기</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
var AVATARS = ['#6246ea', '#4579c8', '#d95f3b'];
var ROLE_COLOR = {
    'ROLE_ADMIN':  'bg-violet-light text-violet',
    'ROLE_USER':   'bg-sky-light text-sky',
    'ROLE_VIEWER': 'bg-blush-light text-blush'
};
var ROLE_DISPLAY = { 'ROLE_ADMIN': '관리자', 'ROLE_USER': '사용자', 'ROLE_VIEWER': '뷰어' };
var ROLE_CD_MAP  = { '관리자': 'ROLE_ADMIN', '사용자': 'ROLE_USER', '뷰어': 'ROLE_VIEWER' };

var IC = {
    plus:    'M12 5v14M5 12h14',
    close:   'M18 6 6 18M6 6l12 12',
    user:    'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
    edit:    'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z',
    trash:   'M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
    refresh: 'M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15',
    eye:     'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
    eyeOff:  'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22'
};

function icon(d, size=18, cls='') {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}"><path d="${d}"/></svg>`;
}

// ── CSRF & API ────────────────────────────────────────────────────
function userCsrf() {
    const raw = document.cookie.split('; ').find(r => r.startsWith('XSRF-TOKEN='))?.split('=')[1] ?? '';
    return decodeURIComponent(raw);
}
async function userApi(url, opts = {}) {
    const method = (opts.method || 'GET').toUpperCase();
    const headers = { 'Content-Type': 'application/json' };
    if (method !== 'GET') headers['X-XSRF-TOKEN'] = userCsrf();
    const res = await fetch(url, { ...opts, headers });
    if (!res.ok) { const msg = await res.text().catch(() => res.statusText); throw new Error(msg); }
    return res.status === 204 ? null : res.json();
}

// ── 상태 ─────────────────────────────────────────────────────────
var users = /*[[${users}]]*/ [];
var stats = /*[[${stats}]]*/ { total: 0, active: 0, inactive: 0 };
var selectedUserId = null;
var newUserRole = '사용자';
var changingRoleCd = null;
var showPwVisible = false;
var userKeyword = '';

function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 모달 유틸 ─────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id)?.classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

// ── 렌더링 ───────────────────────────────────────────────────────
function renderUsersPanel() {
    document.getElementById('users-panel').innerHTML = `
        <div class="grid gap-5 items-start grid-cols-2">
            ${renderUserList()}
            ${renderUserDetail()}
        </div>`;
}

function renderUserList() {
    const filtered = users;

    const header = `
        <div class="px-7 py-5 border-b border-admin-border flex items-center justify-between">
            <h3 class="text-sm font-bold text-ink">사용자 목록</h3>
            <button onclick="openModal('modal-user-add')"
                    class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-violet text-white text-xs font-semibold hover:opacity-90 transition-opacity">
                ${icon(IC.plus, 13)}사용자 추가
            </button>
        </div>`;

    const searchBar = `
        <div class="px-4 py-3 border-b border-admin-border flex items-center gap-2">
            <div class="relative flex-1">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-muted pointer-events-none" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input id="user-keyword" type="text" value="${escapeHtml(userKeyword)}" placeholder="이름 검색..."
                       class="w-full pl-8 pr-3 py-2 rounded-xl border border-admin-border bg-admin text-xs text-ink outline-none focus:border-violet transition-colors"
                       onkeydown="if(event.key==='Enter') searchUsers()" />
            </div>
            <button onclick="searchUsers()" class="px-3 py-2 rounded-xl bg-violet text-white text-xs font-semibold hover:opacity-90 transition-opacity shrink-0">검색</button>
            <button onclick="resetUserSearch()" class="px-2.5 py-2 rounded-xl border border-admin-border text-xs font-medium text-ink-soft hover:bg-admin-subtle transition-colors shrink-0">초기화</button>
        </div>`;

    if (filtered.length === 0) {
        return `
            <div class="bg-admin-surface border border-admin-border rounded-2xl overflow-hidden">
                ${header}${searchBar}
                <p class="py-12 text-center text-sm text-ink-muted">${userKeyword ? '검색 결과가 없어요' : '등록된 사용자가 없어요'}</p>
            </div>`;
    }

    const rows = filtered.map((u, i) => {
        const border = i < filtered.length - 1 ? 'border-b border-admin-border' : '';
        const isSelected = u.userId === selectedUserId;
        const bg = isSelected ? 'bg-violet-light' : 'hover:bg-admin-subtle';
        const nameColor = isSelected ? 'text-violet' : 'text-ink';
        const roleClass = ROLE_COLOR[u.roleCd] || 'bg-admin-subtle text-ink-muted';
        const active = u.useAt === 'Y';
        const toggleBg = active ? 'bg-violet' : 'bg-admin-border';
        const knobPos = active ? 'left-6' : 'left-1';
        const statusColor = active ? 'text-sage' : 'text-ink-muted';
        const statusText = active ? '활성' : '비활성';
        return `
            <div class="flex items-center gap-3.5 px-7 py-3.5 transition-colors ${border} ${bg} cursor-pointer" onclick="selectUser('${u.userId}')">
                <div class="w-9 h-9 rounded-full shrink-0 flex items-center justify-center text-sm font-bold text-white"
                     style="background:${AVATARS[i % AVATARS.length]}">${u.userNm[0]}</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium ${nameColor}">${u.userNm}</p>
                    <p class="text-xs text-ink-muted mt-0.5 font-mono">${u.loginId}</p>
                </div>
                <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${roleClass}">${ROLE_DISPLAY[u.roleCd] || u.roleCd}</span>
                <div onclick="event.stopPropagation();toggleUser('${u.userId}')" class="flex items-center gap-2 cursor-pointer">
                    <span class="text-xs font-medium ${statusColor}">${statusText}</span>
                    <button class="relative w-11 h-6 rounded-full transition-colors duration-200 ${toggleBg}">
                        <span class="absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-all duration-200 ${knobPos}"></span>
                    </button>
                </div>
            </div>`;
    }).join('');

    return `
        <div class="bg-admin-surface border border-admin-border rounded-2xl overflow-hidden">
            ${header}${searchBar}${rows}
        </div>`;
}

function renderUserDetail() {
    const u = users.find(x => x.userId === selectedUserId);
    if (!u) {
        return `
            <div class="bg-admin-surface border border-admin-border rounded-2xl flex flex-col items-center justify-center text-center p-10 text-ink-muted min-h-[200px]">
                ${icon(IC.user, 36, 'mb-3 opacity-30')}
                <p class="text-sm font-medium">사용자를 선택하면</p>
                <p class="text-xs mt-1">상세 정보가 표시돼요</p>
            </div>`;
    }

    const idx = users.findIndex(x => x.userId === selectedUserId);
    const avatarColor = AVATARS[idx % AVATARS.length];
    const roleClass = ROLE_COLOR[u.roleCd] || 'bg-admin-subtle text-ink-muted';
    const active = u.useAt === 'Y';
    const statusColor = active ? 'text-sage' : 'text-ink-muted';
    const statusText = active ? '활성' : '비활성';
    const toggleBg = active ? 'bg-violet' : 'bg-admin-border';
    const knobPos = active ? 'left-6' : 'left-1';

    return `
        <div class="anim-up bg-admin-surface border border-admin-border rounded-2xl overflow-hidden">
            <div class="px-6 py-5 border-b border-admin-border bg-violet-light flex items-start justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center text-base font-bold text-white shrink-0"
                         style="background:${avatarColor}">${u.userNm[0]}</div>
                    <div>
                        <p class="text-sm font-bold text-ink">${u.userNm}</p>
                        <p class="text-xs text-ink-muted mt-0.5">${u.email || ''}</p>
                    </div>
                </div>
                <button onclick="deselectUser()" class="w-7 h-7 rounded-full bg-admin-border flex items-center justify-center text-ink-soft hover:bg-admin-subtle transition-colors shrink-0">
                    ${icon(IC.close, 13)}
                </button>
            </div>
            <div class="px-6 py-4 border-b border-admin-border flex flex-col gap-3.5">
                <div class="flex justify-between items-center">
                    <span class="text-xs text-ink-muted">이름</span>
                    <span class="text-sm font-medium text-ink">${u.userNm}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-ink-muted">ID</span>
                    <span class="text-sm font-medium text-ink font-mono">${u.loginId}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-ink-muted">역할</span>
                    <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${roleClass}">${ROLE_DISPLAY[u.roleCd] || u.roleCd}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-ink-muted">계정 상태</span>
                    <div onclick="toggleUser('${u.userId}')" class="flex items-center gap-2 cursor-pointer">
                        <span class="text-xs font-medium ${statusColor}">${statusText}</span>
                        <button class="relative w-11 h-6 rounded-full transition-colors duration-200 ${toggleBg}">
                            <span class="absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-all duration-200 ${knobPos}"></span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 flex flex-col gap-2.5">
                <button onclick="openRoleChange()" class="w-full flex items-center gap-2.5 px-4 py-3 rounded-xl border border-admin-border text-sm font-medium text-ink hover:bg-admin-subtle transition-colors">
                    ${icon(IC.edit, 16, 'text-sky')} 역할 변경
                </button>
                <button onclick="openPwReset()" class="w-full flex items-center gap-2.5 px-4 py-3 rounded-xl border border-admin-border text-sm font-medium text-ink hover:bg-admin-subtle transition-colors">
                    ${icon(IC.refresh, 16, 'text-violet')} 비밀번호 초기화
                </button>
                <button onclick="openUserDelete()" class="w-full flex items-center gap-2.5 px-4 py-3 rounded-xl border border-blush/30 text-sm font-medium text-blush hover:bg-blush-light transition-colors">
                    ${icon(IC.trash, 16)} 계정 삭제
                </button>
            </div>
        </div>`;
}

function updateUserStats() {
    document.getElementById('stat-total').textContent = stats.total;
    document.getElementById('stat-active').textContent = stats.active;
    document.getElementById('stat-inactive').textContent = stats.inactive;
}

async function refreshStats() {
    stats = await userApi('/admin/users/stats');
    updateUserStats();
}

function selectUser(userId)  { selectedUserId = userId; renderUsersPanel(); }
function deselectUser()       { selectedUserId = null;   renderUsersPanel(); }

async function searchUsers() {
    userKeyword = document.getElementById('user-keyword')?.value.trim() ?? '';
    users = await userApi(`/admin/users/data?keyword=${encodeURIComponent(userKeyword)}`);
    renderUsersPanel();
}

async function resetUserSearch() {
    userKeyword = '';
    users = await userApi('/admin/users/data');
    renderUsersPanel();
}

async function toggleUser(userId) {
    try {
        const updated = await userApi(`/admin/users/${userId}/status`, { method: 'PATCH' });
        users = users.map(u => u.userId === userId ? updated : u);
        renderUsersPanel();
        refreshStats();
    } catch(e) { alert(e.message); }
}

// ── 역할 선택 ─────────────────────────────────────────────────────
function setNewUserRole(role) {
    newUserRole = role;
    document.querySelectorAll('.role-btn').forEach(btn => {
        const isActive = btn.dataset.role === role;
        btn.className = `role-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all ${isActive ? 'border-violet bg-violet-light text-violet' : 'border-admin-border text-ink-soft hover:bg-admin-subtle'}`;
    });
}

function togglePwVisibility() {
    showPwVisible = !showPwVisible;
    const input = document.getElementById('new-user-pw');
    input.type = showPwVisible ? 'text' : 'password';
    document.getElementById('pw-eye-btn').innerHTML = icon(showPwVisible ? IC.eyeOff : IC.eye, 16);
}

// ── CRUD ──────────────────────────────────────────────────────────
async function confirmAddUser() {
    const userNm  = document.getElementById('new-user-name').value.trim();
    const loginId = document.getElementById('new-user-id').value.trim();
    const passwd  = document.getElementById('new-user-pw').value.trim();
    if (!userNm || !loginId || !passwd) return;
    try {
        const added = await userApi('/admin/users', {
            method: 'POST',
            body: JSON.stringify({ loginId, passwd, userNm, email: null, roleCd: ROLE_CD_MAP[newUserRole] })
        });
        users.push(added);
        document.getElementById('new-user-name').value = '';
        document.getElementById('new-user-id').value = '';
        document.getElementById('new-user-pw').value = '';
        showPwVisible = false;
        document.getElementById('new-user-pw').type = 'password';
        newUserRole = '사용자';
        closeModal('modal-user-add');
        renderUsersPanel();
        refreshStats();
    } catch(e) { alert(e.message); }
}

function openRoleChange() {
    const u = users.find(x => x.userId === selectedUserId);
    if (!u) return;
    const idx = users.findIndex(x => x.userId === selectedUserId);
    document.getElementById('role-change-user-info').innerHTML = `
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white shrink-0"
             style="background:${AVATARS[idx % AVATARS.length]}">${u.userNm[0]}</div>
        <div><p class="text-sm font-semibold text-ink">${u.userNm}</p><p class="text-xs text-ink-muted font-mono">${u.loginId}</p></div>`;
    setChangeRole(u.roleCd);
    document.getElementById('confirm-role-change-btn').onclick = confirmRoleChange;
    openModal('modal-role-change');
}

function setChangeRole(roleCd) {
    changingRoleCd = roleCd;
    document.querySelectorAll('.role-change-btn').forEach(btn => {
        const isActive = btn.dataset.role === roleCd;
        btn.className = `role-change-btn flex-1 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all ${isActive ? 'border-violet bg-violet-light text-violet' : 'border-admin-border text-ink-soft hover:bg-admin-subtle'}`;
    });
}

async function confirmRoleChange() {
    if (!changingRoleCd) return;
    try {
        const updated = await userApi(`/admin/users/${selectedUserId}/role`, {
            method: 'PATCH',
            body: JSON.stringify({ roleCd: changingRoleCd })
        });
        users = users.map(u => u.userId === selectedUserId ? updated : u);
        closeModal('modal-role-change');
        renderUsersPanel();
    } catch(e) { alert(e.message); }
}

function openPwReset() {
    const u = users.find(x => x.userId === selectedUserId);
    if (!u) return;
    const idx = users.findIndex(x => x.userId === selectedUserId);
    document.getElementById('reset-user-info').innerHTML = `
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white shrink-0"
             style="background:${AVATARS[idx % AVATARS.length]}">${u.userNm[0]}</div>
        <div><p class="text-sm font-semibold text-ink">${u.userNm}</p><p class="text-xs text-ink-muted font-mono">${u.loginId}</p></div>`;
    document.getElementById('confirm-pw-reset-btn').onclick = confirmPwReset;
    openModal('modal-pw-reset');
}

async function confirmPwReset() {
    try {
        await userApi(`/admin/users/${selectedUserId}/password-reset`, { method: 'POST' });
        closeModal('modal-pw-reset');
    } catch(e) { alert(e.message); }
}

function openUserDelete() {
    const u = users.find(x => x.userId === selectedUserId);
    if (!u) return;
    const idx = users.findIndex(x => x.userId === selectedUserId);
    document.getElementById('delete-user-info').innerHTML = `
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white shrink-0"
             style="background:${AVATARS[idx % AVATARS.length]}">${u.userNm[0]}</div>
        <div><p class="text-sm font-semibold text-ink">${u.userNm}</p><p class="text-xs text-ink-muted font-mono">${u.loginId}</p></div>`;
    document.getElementById('delete-user-confirm-text').innerHTML =
        `<span class="font-semibold text-blush">${u.userNm}</span>의 계정을 삭제하시겠어요?`;
    document.getElementById('confirm-user-delete').onclick = confirmDeleteUser;
    openModal('modal-user-delete');
}

async function confirmDeleteUser() {
    try {
        await userApi(`/admin/users/${selectedUserId}`, { method: 'DELETE' });
        users = users.filter(u => u.userId !== selectedUserId);
        selectedUserId = null;
        closeModal('modal-user-delete');
        renderUsersPanel();
        refreshStats();
    } catch(e) { alert(e.message); }
}

// ── 초기화 ───────────────────────────────────────────────────────
renderUsersPanel();
updateUserStats();

['modal-user-add', 'modal-pw-reset', 'modal-user-delete', 'modal-role-change'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', e => { if (e.target === el) closeModal(id); });
});

</script>
</div>
</div>

</body>
</html>
