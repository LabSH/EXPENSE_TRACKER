<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <main class="flex-1 overflow-y-auto h-screen p-9">
        <div class="flex items-center gap-3.5 mb-8">
            <button onclick="toggleSidebar()" class="w-8 h-8 rounded-xl border border-cream-border bg-cream-surface flex items-center justify-center text-ink-soft hover:bg-cream-subtle transition-colors shrink-0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h12"/></svg>
            </button>
            <h1 class="font-bold text-ink tracking-tight text-3xl">수입</h1>
        </div>
        <div class="bg-cream-surface border border-cream-border rounded-2xl overflow-hidden">
            <p th:if="${incomes.empty}" class="py-16 text-center text-sm text-ink-muted">등록된 수입이 없어요</p>
            <th:block th:if="${not incomes.empty}">
                <div class="grid px-6 py-3 bg-cream-subtle border-b border-cream-border text-xs font-semibold text-ink-muted uppercase tracking-wide" style="grid-template-columns:110px 110px 1fr 130px 1fr">
                    <span>소득일자</span><span>소득종류</span><span>내용</span><span>금액</span><span>메모</span>
                </div>
                <div th:each="inc : ${incomes}"
                     class="grid items-center px-6 py-4 border-b border-cream-border last:border-0"
                     style="grid-template-columns:110px 110px 1fr 130px 1fr">
                    <span class="text-sm text-ink-soft" th:text="${inc.incomeDt()}">소득일자</span>
                    <span class="text-sm text-ink-soft" th:text="${inc.incomeTypeNm()}">소득종류</span>
                    <span class="text-sm text-ink" th:text="${inc.content()}">내용</span>
                    <span class="text-sm font-semibold text-sage"
                          th:text="'+' + ${#numbers.formatDecimal(inc.amount(), 0, 'COMMA', 0, 'POINT')} + '원'">0원</span>
                    <span class="text-sm text-ink-muted" th:text="${inc.memo()}">메모</span>
                </div>
            </th:block>
        </div>
    </main>
</th:block>
</body>
</html>
