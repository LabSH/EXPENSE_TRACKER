<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가계부 대시보드</title>
    <th:block th:replace="~{config/config :: config}"></th:block>
    <style>
        @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
        @keyframes slideUp { from{opacity:0;transform:translateY(24px) scale(.98)} to{opacity:1;transform:none} }
        @keyframes slideDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
        @keyframes popIn   { from{opacity:0;transform:scale(.94) translateY(6px)} to{opacity:1;transform:none} }
        .anim-fadeIn   { animation:fadeIn .2s ease forwards }
        .anim-slideUp  { animation:slideUp .32s cubic-bezier(.22,1,.36,1) forwards }
        .anim-slideDown{ animation:slideDown .25s cubic-bezier(.22,1,.36,1) both }
        .anim-popIn    { animation:popIn .25s cubic-bezier(.22,1,.36,1) forwards }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
        input[type=number]{-moz-appearance:textfield}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#E5E0D8;border-radius:3px}
    </style>
</head>
<body class="bg-cream font-sans text-ink">

<div class="flex h-screen overflow-hidden">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-1 overflow-hidden">
        <div th:replace="~{dashboard/index :: content}"></div>
    </div>
</div>

<script th:src="@{/js/common/layout.js}"></script>
</body>
</html>
