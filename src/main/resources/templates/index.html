<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가계부 대시보드</title>
    <th:block th:replace="~{config/config :: config}"></th:block>
    <style>
        @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
        @keyframes slideUp { from{opacity:0;transform:translateY(24px) scale(.98)} to{opacity:1;transform:none} }
        @keyframes slideDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
        @keyframes popIn   { from{opacity:0;transform:scale(.94) translateY(6px)} to{opacity:1;transform:none} }
        .anim-fadeIn   { animation:fadeIn .2s ease forwards }
        .anim-slideUp  { animation:slideUp .32s cubic-bezier(.22,1,.36,1) forwards }
        .anim-slideDown{ animation:slideDown .25s cubic-bezier(.22,1,.36,1) both }
        .anim-popIn    { animation:popIn .25s cubic-bezier(.22,1,.36,1) forwards }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
        input[type=number]{-moz-appearance:textfield}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#E5E0D8;border-radius:3px}
    </style>
</head>
<body class="bg-cream font-sans text-ink">

<div class="flex h-screen overflow-hidden">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-1 overflow-hidden">
        <div th:replace="~{dashboard/index :: content}"></div>
    </div>
</div>

<script>
    let sidebarOpen = true;
    let currentActiveNav = 'dashboard';

    function toggleSidebar() {
        sidebarOpen = !sidebarOpen;
        const wrapper = document.getElementById('sidebar-wrapper');
        wrapper.style.width = sidebarOpen ? '224px' : '0px';
        wrapper.style.marginRight = sidebarOpen ? '0' : '-224px';
    }

    function movePill(btn) {
        const pill = document.getElementById('nav-pill');
        if (!pill || !btn) return;
        pill.style.top = btn.offsetTop + 'px';
        pill.style.height = btn.offsetHeight + 'px';
        pill.style.opacity = '1';
    }

    function setActiveNav(id) {
        currentActiveNav = id;
        const nav = document.getElementById('sidebar-nav');
        const activeBtn = nav ? nav.querySelector(`[data-nav="${id}"]`) : null;
        movePill(activeBtn);

        document.querySelectorAll('[data-nav]').forEach(el => {
            const isActive = el.dataset.nav === id;
            el.classList.toggle('text-sage', isActive);
            el.classList.toggle('font-semibold', isActive);
            el.classList.toggle('text-ink-soft', !isActive);
            el.classList.toggle('font-normal', !isActive);
        });
    }

    function initNavFromUrl() {
        const pathMap = {
            '/': 'dashboard',
            '/dashboard': 'dashboard',
            '/income': 'income',
            '/expense': 'expense',
            '/fixed-expense': 'fixed-expense',
            '/budget': 'budget',
            '/report': 'report',
            '/setting': 'settings'
        };
        const id = pathMap[window.location.pathname] || 'dashboard';
        const pill = document.getElementById('nav-pill');
        if (pill) {
            pill.style.transition = 'none';
            setActiveNav(id);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                pill.style.transition = 'top .28s cubic-bezier(.4,0,.2,1), height .28s cubic-bezier(.4,0,.2,1)';
            }));
        } else {
            setActiveNav(id);
        }
    }

    document.addEventListener('DOMContentLoaded', initNavFromUrl);
    document.addEventListener('htmx:historyRestore', initNavFromUrl);
</script>
</body>
</html>
