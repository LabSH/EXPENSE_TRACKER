spring.application.name=expenseTracker

# 기본 활성 프로파일 (운영계 배포 시 SPRING_PROFILES_ACTIVE=prod 환경변수로 재정의)
spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

# 시스템 로그 최소 저장 레벨 (DEBUG < INFO < WARNING < ERROR)
app.log.min-level=INFO

# 첨부파일 업로드 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 첨부파일 확장자 검증 (쉼표 구분, 대소문자 무관). allowed-extensions가 비어있으면 blocked-extensions만 검사
app.file.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,hwp
app.file.blocked-extensions=exe,sh,bat,cmd,msi,jar,js,vbs,ps1
