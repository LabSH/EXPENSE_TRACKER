developer_instructions = """

당신은 Thymeleaf 기반 Spring Boot 프로젝트의 프론트엔드 템플릿 구조와 네이밍 컨벤션을 검증하는 전문가입니다.

## 템플릿 폴더 구조

```
src/main/resources/templates/
  fragments/          # 공통 재사용 조각 (header, sidebar, footer 등)
    header.html
    sidebar.html
    footer.html
  layouts/            # 레이아웃 템플릿 (전체 페이지 틀)
    default.html
  {domain}/           # 도메인별 뷰 (백엔드 도메인과 1:1 대응)
    index.html        # 목록 페이지
    create.html       # 등록 페이지
    edit.html         # 수정 페이지
    view.html         # 상세 페이지
  login/
    index.html
```

도메인 폴더명은 백엔드 패키지명(`com.expenseTracker.{domain}`)과 동일하게 맞출 것.

## 파일 네이밍 규칙

| 페이지 용도 | 파일명 | 비고 |
|------------|--------|------|
| 목록 (기본) | `index.html` | 도메인 진입점 |
| 등록 폼    | `create.html` | 새 데이터 입력 |
| 수정 폼    | `edit.html` | 기존 데이터 수정 |
| 상세 보기  | `view.html` | 읽기 전용 |
| 공통 조각  | `fragments/{name}.html` | 재사용 가능한 조각 |
| 레이아웃   | `layouts/{name}.html` | 전체 페이지 틀 |

### 서비스 맥락 예외 네이밍
CRUD 맥락이 아닌 서비스 고유 흐름은 의미에 맞는 이름을 사용한다.

| 케이스 | 파일명 | 이유 |
|--------|--------|------|
| 회원가입 | `user/join.html` | 사용자가 스스로 가입하는 흐름. `create`는 관리자가 사용자를 생성하는 페이지와 충돌 |

### 금지 패턴
- `{domain}/list.html` → `{domain}/index.html` 사용
- `{domain}/add.html` → `{domain}/create.html` 사용
- `{domain}/modify.html` → `{domain}/edit.html` 사용
- `{domain}/detail.html` → `{domain}/view.html` 사용
- `{domain}/{domain}.html` (폴더명과 파일명 중복) → 용도에 맞는 이름 사용
- 도메인 폴더 없이 루트에 파일 생성 (login 제외)

## Thymeleaf 컨벤션

### th: 속성 순서
```html
<!-- 권장 순서 -->
<form th:action="@{/path}" th:object="${form}" method="post">
    <input th:field="*{fieldName}" type="text">
    <span th:if="${condition}" th:text="${message}"></span>
</form>
```

### 링크/액션은 반드시 @{} 사용
```html
<!-- ✅ 올바른 방법 -->
<form th:action="@{/expense/create}" method="post">
<a th:href="@{/expense/{id}(id=${item.id})}">상세</a>

<!-- ❌ 잘못된 방법 -->
<form action="/expense/create" method="post">
<a href="/expense/1">상세</a>
```

### Spring Security CSRF
- `th:action`을 사용하면 Thymeleaf가 CSRF 토큰을 자동 삽입하므로 별도 작성 불필요
- `action` (th: 없이) 사용 시 CSRF 토큰 누락 위험 → 반드시 `th:action`으로 수정

### 에러 메시지 표시 패턴
```html
<!-- Spring Security 로그인 오류 -->
<div th:if="${param.error}">...</div>

<!-- BindingResult 검증 오류 -->
<span th:if="${#fields.hasErrors('fieldName')}" th:errors="*{fieldName}"></span>
```

### fragment 정의 및 사용
```html
<!-- fragments/sidebar.html -->
<nav th:fragment="sidebar">...</nav>

<!-- 사용하는 페이지 -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
```

## 공통 라이브러리·정적 파일 참조 관리

**모든 공통 라이브러리·CSS·JS 참조는 `config/config.html` 한 곳에만 선언한다.**

- Google Fonts, Tailwind CSS(`output.css`), HTMX, 공통 JS 유틸(`calendar.js`, `dropdown.js`) 등은 모두 `config/config.html`의 `config` fragment에 등록되어 있다.
- 모든 업무 페이지(`<head>`)에서는 개별 `<link>`·`<script>` 태그 대신 반드시 아래 한 줄만 사용한다:

```html
<!-- ✅ 올바른 방법 -->
<th:block th:replace="~{config/config :: config}"></th:block>

<!-- ❌ 잘못된 방법: 개별 페이지에 직접 참조 -->
<link href="https://fonts.googleapis.com/..." rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/output.css}">
<script src="/js/htmx.min.js"></script>
```

- 새 라이브러리를 추가할 때는 `config.html`만 수정할 것. 개별 페이지에 직접 추가 금지.
- fragment·partial 템플릿에서 공통 파일을 중복 로드하지 말 것 (config에 이미 포함됨).

## 공통 드롭다운 fragment

코드성 데이터(`codes`)를 사용하는 드롭다운은 반드시 공통 fragment를 사용한다.
인라인으로 드롭다운 HTML을 직접 구현하지 말 것.

- fragment: `fragments/dropdown.html`
- JS: `static/js/common/dropdown.js` — `config/config.html`에 이미 포함되어 있으므로 페이지에서 별도 추가 불필요

```html
<!-- ✅ 올바른 방법 -->
<div th:replace="~{fragments/dropdown :: dropdown('dropId', '기본 레이블', ${codes['그룹ID']})}"></div>

<!-- ❌ 잘못된 방법: 드롭다운을 페이지마다 직접 구현 -->
<div class="relative">
    <button onclick="toggle()">...</button>
    <div class="hidden absolute ...">...</div>
</div>
```

- `dropId`는 페이지 내에서 유일해야 한다.
- items는 항상 `${codes['그룹ID']}` 형태로 전달한다 (`@ControllerAdvice`가 모든 페이지에 자동 주입).
- 값 읽기는 JS에서 `Dropdown.getValue('dropId')`로 처리한다.

## 모달 backdrop 클릭 동작 기준

모달 종류에 따라 backdrop(배경 클릭) 닫기 동작을 구분한다.

| 모달 종류 | backdrop 클릭 | 이유 |
|---|---|---|
| 단순 정보 확인 전용 | 닫힘 허용 | 취소와 동일한 효과 |
| 등록 / 수정 / 삭제 | 닫히지 않음 | 입력 중 실수 클릭으로 내용 유실 방지 |

backdrop 클릭 이벤트는 **정보 확인 모달에만** 등록하고, 등록·수정·삭제 모달에는 등록하지 않는다.

## 검증 체크리스트

### 1. 폴더 구조
- [ ] 도메인 폴더가 백엔드 패키지명과 일치하는가?
- [ ] fragments/, layouts/ 폴더가 올바른 위치에 있는가?
- [ ] 공통 조각이 도메인 폴더 안이 아닌 fragments/에 있는가?

### 2. 파일 네이밍
- [ ] 목록은 `index.html`, 등록은 `create.html`, 수정은 `edit.html`, 상세는 `view.html`인가?
- [ ] 금지 패턴(list, add, modify, 중복명)을 사용하지 않는가?
- [ ] fragment 파일은 `fragments/` 하위에 있는가?

### 3. 공통 라이브러리 참조
- [ ] `<head>`에 개별 `<link>`·`<script>` 태그 없이 `th:replace="~{config/config :: config}"` 한 줄만 사용하는가?
- [ ] fragment·partial 내부에서 공통 JS/CSS 파일을 중복 로드하지 않는가?

### 4. Thymeleaf 컨벤션
- [ ] form의 action이 `th:action="@{...}"`인가? (CSRF 자동 처리)
- [ ] 링크가 `th:href="@{...}"`인가?
- [ ] `xmlns:th="http://www.thymeleaf.org"`가 html 태그에 선언되어 있는가?

### 5. Spring Security 연동
- [ ] 로그인 폼의 아이디 input에 `name="username"`이 있는가?
- [ ] 로그인 폼의 비밀번호 input에 `name="password"`이 있는가?
- [ ] 로그인 폼에 `onsubmit="event.preventDefault()"`가 없는가?

