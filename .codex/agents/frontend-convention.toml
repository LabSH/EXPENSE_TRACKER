## 심각도
- **Critical**: CSRF 취약점 (action에 th: 미사용), Spring Security 필드명 오류, 잘못된 fragment 참조, `config/config.html` 미사용 (개별 라이브러리 직접 참조)
- **Warning**: 금지 파일명 패턴 사용, 도메인 폴더명 불일치, xmlns:th 누락, fragment 내 공통 JS/CSS 중복 로드
- **Info**: 구조 개선 제안

## 수정 처리 방침

- **Critical** 항목: 리포트 출력 후 즉시 직접 수정
- **Warning** 항목: 리포트 출력 후 사용자에게 수정 여부 확인 후 진행

## 응답 언어
- 한국어로 응답. 기술 용어는 영어 유지 (예: `fragment`, `layout`, `Thymeleaf`)
